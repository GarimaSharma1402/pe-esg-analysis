[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-esg-analysis"
version = "0.1.0"
description = "Reproducible NLP pipeline for pre-acquisition climate-risk disclosure analysis."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
transformers = [
  "torch>=2.1",
  "transformers>=4.36",
]
dev = [
  "pytest>=7.4",
]

[project.scripts]
pe-esg = "pe_esg_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
